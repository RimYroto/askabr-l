# Груша (4 класса).
# Подготовка: tools/split_dataset.py --source "$PEAR_LEAVES_ROOT" ...
# Обучение: askabr-train --config configs/pear_only.yaml

paths:
  train_root: "data/split_pear/train"
  val_root: "data/split_pear/val"
  holdout_root: "data/split_pear/holdout"

artifacts_dir: "artifacts_pear"
seed: 42

model:
  backbone: "resnet50"
  pretrained: true
  num_classes: null

train:
  image_size: 224
  batch_size: 32
  epochs: 8
  lr: 0.00035
  weight_decay: 0.018
  num_workers: 0
  prefetch_factor: 4
  no_tqdm: true
  amp: true
  amp_mps: true
  torch_compile: false
  strong_augment: true
  label_smoothing: 0.06
  use_class_weights: true
  scheduler: "cosine"

data_root: "data/split_pear/train"
train_ratio: 0.85

resistance:
  severity_rules:
    - pattern: "healthy"
      weight: 0.0
    - pattern: "spot"
      weight: 0.55
    - pattern: "curl"
      weight: 0.5
    - pattern: "slug"
      weight: 0.65
  default_severity_weight: 0.65
