# Пути относительно корня проекта askabr-l/
data_root: "data/plantvillage"
artifacts_dir: "artifacts"
train_ratio: 0.85
seed: 42

model:
  backbone: "resnet18"
  pretrained: true
  num_classes: null

train:
  image_size: 224
  batch_size: 32
  epochs: 15
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 0
  amp: true
  strong_augment: true

download:
  kaggle_dataset: "abdallahalidev/plantvillage-dataset-ori"

resistance:
  severity_rules:
    - pattern: "healthy"
      weight: 0.0
    - pattern: "scab"
      weight: 0.65
    - pattern: "rust"
      weight: 0.75
    - pattern: "mildew"
      weight: 0.7
    - pattern: "blight"
      weight: 0.85
    - pattern: "rot"
      weight: 0.8
    - pattern: "spot"
      weight: 0.55
    - pattern: "curl"
      weight: 0.5
    - pattern: "mosaic"
      weight: 0.8
    - pattern: "___"
      weight: 0.6
  default_severity_weight: 0.65
