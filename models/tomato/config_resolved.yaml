paths:
  train_root: data/split_tomato/train
  val_root: data/split_tomato/val
  holdout_root: data/split_tomato/holdout
artifacts_dir: artifacts_tomato
seed: 42
model:
  backbone: resnet50
  pretrained: true
  num_classes: 10
train:
  image_size: 224
  batch_size: 32
  epochs: 8
  lr: 0.00035
  weight_decay: 0.018
  num_workers: 0
  prefetch_factor: 4
  no_tqdm: true
  amp: true
  amp_mps: true
  torch_compile: false
  strong_augment: true
  label_smoothing: 0.06
  use_class_weights: true
  scheduler: cosine
  warmup_epochs: 1
data_root: data/split_tomato/train
train_ratio: 0.85
download:
  kaggle_dataset: abdallahalidev/plantvillage-dataset-ori
resistance:
  severity_rules:
  - pattern: healthy
    weight: 0.0
  - pattern: scab
    weight: 0.65
  - pattern: rust
    weight: 0.75
  - pattern: mildew
    weight: 0.7
  - pattern: blight
    weight: 0.85
  - pattern: rot
    weight: 0.8
  - pattern: spot
    weight: 0.55
  - pattern: curl
    weight: 0.5
  - pattern: mosaic
    weight: 0.8
  - pattern: mite
    weight: 0.5
  - pattern: ___
    weight: 0.6
  default_severity_weight: 0.65
